name: Verify FrameSure
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python3 -m scripts.preflight
      - run: python3 -m compileall -q backend scripts tests
      - run: node tests/frontend_regressions.mjs
      - run: python3 -m scripts.validate
      - run: python3 -m scripts.network_test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-evidence
          path: evidence/
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python3 -m pip install -r requirements-browser.txt
      - run: python3 -m playwright install --with-deps chromium
      - run: python3 tests/browser_e2e.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: evidence/browser/
